<section class="trending py-5">

    <div class="container">

        <div class="text-center mb-5">

            <h2 class="section-title">🔥 Trending Products</h2>

            <p class="text-muted">
                Discover our most popular products this week
            </p>

        </div>
        @if (loading) {

        <div class="text-center py-5">

            <div class="spinner-border text-warning" role="status"></div>

            <p class="mt-3">Loading Products...</p>

        </div>

        }
        @else {
        <div class="row g-4">

            @for(product of products; track product._id){

            <div class="col-lg-3 col-md-6 col-sm-6">

                <div class="card product-card h-100">

                    <div class="image-box">

                        <span class="badge badge-sale">
                            Trending
                        </span>

                        <img
                            [src]="'http://localhost:2005/uploads/products/' + product.image"
                            class="card-img-top product-image"
                            [alt]="product.name">

                    </div>

                    <div class="card-body">

                        <small class="text-secondary">
                            {{product.brand}}
                        </small>

                        <h5 class="product-title mt-2">
                            {{product.name}}
                        </h5>

                        <div class="stars">

                            ★★★★★

                            <span class="text-dark">
                                {{product.rating}}
                            </span>

                        </div>

                        <h4 class="price mt-3">
                            {{`${product.price}'EGP `}}
                        </h4>

                    </div>

                    <div class="card-footer bg-white border-0">

                        <button class="add-btn" (click)="addToCart(product)" routerLink="/cart">
                            🛒 Add to Cart
                        </button>

                        <button
                            class="details-btn"
                            [routerLink]="['/products',product._id]">

                            View Details

                        </button>

                    </div>

                </div>

            </div>

            }

        </div>
      }
    </div>

</section>
